# NOTE: written but not yet executed by the authors. Test with: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: screening
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening"]
      interval: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://screening:${POSTGRES_PASSWORD}@db:5432/screening
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
volumes:
  pgdata:
